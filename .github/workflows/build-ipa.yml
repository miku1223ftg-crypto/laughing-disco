name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project NXShelf.xcodeproj -scheme NXShelf -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package the IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/NXShelf.app Payload/
          zip -qry NXShelf.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NXShelf-ipa
          path: NXShelf.ipa
